services:
  backend:
    build: ./backend
    ports:
      - "3001:3001"
    environment:
      - FRONTEND_URL=http://localhost
      - PORT=3001
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  titan:
    image: ghcr.io/ianfigueroa/titan:latest
    ports:
      - "9001:9001"
    restart: unless-stopped
